<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mijn ITalent Portfolio - Home Run Editie</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --grass-green: #2e8b57;
    --dirt-brown: #d2b48c;
    --baseball-white: #fdfdfd;
    --stitch-red: #cc0000;
    --text-dark: #333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--grass-green);
    color: var(--text-dark);
    overflow-x: hidden;
    cursor: crosshair;
}

h1, h2, h3 {
    font-family: 'Bebas Neue', cursive;
    letter-spacing: 2px;
}

/* NAV */
nav {
    background-color: var(--dirt-brown);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px dashed var(--stitch-red);
    position: sticky;
    top: 0;
}

nav h1 {
    color: white;
    text-shadow: 2px 2px black;
}

nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* HERO */
.hero {
    text-align: center;
    padding: 80px 20px;
    background: radial-gradient(circle, var(--dirt-brown), var(--grass-green));
    color: white;
}

/* SECTION */
.section-container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
}

.section-title {
    text-align: center;
    font-size: 3rem;
    color: white;
    margin-bottom: 30px;
}

/* CARDS */
.grid-8 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    height: 300px;
    perspective: 1000px;
}

.card-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.card:hover .card-inner {
    transform: rotateY(180deg);
}

.card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    border-radius: 10px;
    padding: 20px;
}

.card-front {
    background: white;
}

.card-back {
    background: var(--dirt-brown);
    color: white;
    transform: rotateY(180deg);
}

/* ⚾ BATS */
.bat-container {
    display: flex;
    justify-content: center;
    gap: 80px;
    margin-top: 50px;
}

.bat {
    width: 120px;
    height: 400px;
    background: url('images/bat.png') center/contain no-repeat;
    cursor: pointer;
    position: relative;
    transition: transform 0.3s;
}

.bat span {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) rotate(-90deg);
    background: rgba(255,255,255,0.7);
    padding: 5px 10px;
    font-weight: bold;
}

.bat:hover {
    transform: scale(1.1) rotate(-10deg);
}

.bat.zoom {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(5);
    z-index: 9999;
    transition: all 0.6s;
}

/* FOOTER */
footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 50px;
    position: relative;
}

#easter-egg-btn {
    position: absolute;
    right: 20px;
    bottom: 20px;
    opacity: 0.3;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
}

#easter-egg-btn:hover {
    opacity: 1;
}

/* KONAMI BALL */
#homerun-ball {
    position: fixed;
    bottom: -50px;
    left: -50px;
    font-size: 5rem;
    display: none;
}

@keyframes flyOver {
    0% { transform: translate(0,0); }
    50% { transform: translate(50vw,-80vh) scale(2); }
    100% { transform: translate(110vw,20vh); }
}

</style>
</head>

<body>

<nav>
    <h1>⚾ ITalent Portfolio</h1>
</nav>

<section class="hero">
    <h2>Welkom in de Major League van IT</h2>
</section>

<section class="section-container">
    <h2 class="section-title">All-Star Games</h2>

    <div class="bat-container">
        <div class="bat" onclick="openActivity(event,'hackathon.html')">
            <span>Hackathon</span>
        </div>

        <div class="bat" onclick="openActivity(event,'bedrijf.html')">
            <span>Bedrijf</span>
        </div>

        <div class="bat" onclick="openActivity(event,'certificaat.html')">
            <span>Certificaat</span>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2026 ITalent Portfolio</p>
    <button id="easter-egg-btn">⚾</button>
</footer>

<div id="homerun-ball">⚾</div>

<script>
function openActivity(e,page){
    const bat = e.currentTarget;
    bat.classList.add("zoom");

    setTimeout(()=>{
        window.location.href = page;
    },600);
}

/* Easter egg clicks */
let clicks = 0;
document.getElementById("easter-egg-btn").onclick = () => {
    clicks++;
    if(clicks===3){
        alert("STRIKE THREE!");
        clicks=0;
    }
};

/* Konami */
const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let pos=0;

document.addEventListener('keydown',e=>{
    if(e.key===code[pos] || e.key.toLowerCase()===code[pos]){
        pos++;
        if(pos===code.length){
            const ball=document.getElementById('homerun-ball');
            ball.style.display="block";
            ball.style.animation="flyOver 3s";
            pos=0;
        }
    } else pos=0;
});
</script>

</body>
</html>
